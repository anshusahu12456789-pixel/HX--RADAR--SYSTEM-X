
name: Build HS RADAR COCKPIT EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyserial pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name HS_RADAR_SYSTEM_X main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HS-RADAR-SYSTEM-X-COCKPIT-EXE
          path: dist/HS_RADAR_SYSTEM_X.exe
          

          
